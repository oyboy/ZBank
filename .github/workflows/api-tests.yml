name: Run api tests

on:
  push:
    branches: [ master, api ]
  pull_request:
    branches: [ master, api ]

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run api tests
        run: ./gradlew test

      - name: Save api tests results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-tests-results
          path: build/allure-results

  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [ api-tests ]
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Download api tests results
        uses: actions/download-artifact@v4
        with:
          name: api-tests-results
          path: build/allure-results

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate Allure Report
        run: |
          ./gradlew allureReport
          mkdir -p public
          cp -R build/reports/allure-report/* public/

      - name: Check if Allure report is generated
        run: ls -R build/reports/allure-report

      - name: Check Allure test results
        run: ls -R build/allure-results

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4